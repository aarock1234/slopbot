name: slopbot

on:
    pull_request:

permissions:
    contents: read
    pull-requests: write

jobs:
    slop:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Score this pull request
              uses: ./
              with:
                  openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
